name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project HomebrewSender.xcodeproj \
            -scheme HomebrewSender \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and Package IPA
        run: |
          xcodebuild archive \
            -project HomebrewSender.xcodeproj \
            -scheme HomebrewSender \
            -destination "generic/platform=iOS" \
            -archivePath build/HomebrewSender.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -r build/HomebrewSender.xcarchive/Products/Applications/HomebrewSender.app build/Payload/
          cd build
          zip -r HomebrewSender.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HomebrewSender.ipa
          path: build/HomebrewSender.ipa


  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomebrewSender.apk
          path: android/app/build/outputs/apk/release/app-release.apk
